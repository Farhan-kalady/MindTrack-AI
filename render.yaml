services:
  - type: web
    name: mindtrack-ai
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt && python mindtrack_backend/manage.py collectstatic --noinput && python mindtrack_backend/manage.py migrate
    startCommand: gunicorn --chdir mindtrack_backend mindtrack_backend.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
