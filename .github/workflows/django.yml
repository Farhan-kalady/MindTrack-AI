name: Django CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r mindtrack_backend/requirements.txt

    - name: Run tests
      env:
        SECRET_KEY: 'test-secret-key-for-ci-only-not-real'
        DEBUG: 'True'
        DATABASE_URL: 'sqlite:////tmp/test_db.sqlite3'
        GEMINI_API_KEY: 'test-key-not-real'
      run: |
        cd mindtrack_backend
        python manage.py migrate --run-syncdb
        python manage.py test journals --verbosity=2