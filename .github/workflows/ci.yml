name: MindTrack AI — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=70
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-real
          DEBUG: True
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: sqlite:///test_ci.db
          GEMINI_API_KEY: fake-key-for-tests
          SUPABASE_URL: https://fake.supabase.co
          SUPABASE_ANON_KEY: fake-anon-key
          SUPABASE_SERVICE_ROLE_KEY: fake-service-key
          CORS_ALLOWED_ORIGINS: http://localhost:5173

  frontend-build:
    name: Frontend Build Check (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://mindtrack-ai.onrender.com/api

  deploy-check:
    name: Deploy Ready Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: All checks passed
        run: echo "✅ Backend tests passed. Frontend builds. Ready for Render + Vercel deploy."
