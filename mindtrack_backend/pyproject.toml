[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mindtrack_backend.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["journals/tests", "users/tests"]

[tool.coverage.run]
source = ["journals", "users"]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70